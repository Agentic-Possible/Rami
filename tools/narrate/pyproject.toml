[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "N", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["narrate"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["kokoro"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["narrate"]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise SystemExit", "if __name__ == .__main__.:", "class Backend\\(Protocol\\):"]

[tool.vulture]
paths = ["narrate"]
min_confidence = 100

[tool.deptry]
requirements_files = ["requirements.txt"]
requirements_files_dev = ["requirements-dev.txt"]

[tool.deptry.per_rule_ignores]
# Optional GPU backend, explicitly documented and installed by the operator.
DEP001 = ["kokoro"]
