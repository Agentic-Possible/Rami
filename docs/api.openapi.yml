openapi: 3.1.0
info:
  title: Marginalia APIs
  version: 1.0.0
paths:
  /api/chat:
    post:
      summary: Server-pinned OpenRouter chat relay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                stream: {type: boolean}
                messages:
                  type: array
                  minItems: 1
                  maxItems: 60
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: {enum: [system, user, assistant]}
                      content: {type: string}
              description: At most 120000 total content characters and 600000 body bytes. Model/provider fields are ignored.
      responses:
        "200":
          description: OpenAI-compatible completion or SSE stream
          content:
            text/event-stream: {schema: {type: string}}
            application/json: {schema: {type: object}}
        "400": {description: Invalid JSON or content limits}
        "403": {description: Cross-origin browser request}
        "429": {description: Best-effort isolate-local throttle}
        "503": {description: Key absent, chat disabled, circuit open, or upstream unavailable}
        "504": {description: Upstream headers exceeded 30 seconds}
  /api/gutenberg:
    get:
      summary: Same-origin Project Gutenberg catalog search and EPUB download relay
      description: Exactly one of search or book. Never proxies an arbitrary URL.
      parameters:
        - {in: query, name: search, schema: {type: string, maxLength: 200}}
        - {in: query, name: book, schema: {type: string, pattern: '^\d{1,8}$'}}
      responses:
        "200":
          description: 'Normalized results (id, title, optional author) for search, or an EPUB stream for book'
          content:
            application/json: {schema: {type: object}}
            application/epub+zip: {schema: {type: string, format: binary}}
        "400": {description: Missing, invalid, or overlong parameter}
        "403": {description: Cross-origin browser request or hotlink}
        "405": {description: Not a GET}
        "429": {description: Best-effort isolate-local throttle, separate from chat}
        "502": {description: Upstream refused or returned no body}
        "504": {description: Upstream headers exceeded 20 seconds}
  /api/covers:
    get:
      summary: Same-origin Open Library cover search and image relay
      description: Exactly one of title (with optional author) or id. Never proxies an arbitrary URL.
      parameters:
        - {in: query, name: title, schema: {type: string, maxLength: 200}}
        - {in: query, name: author, schema: {type: string, maxLength: 200}}
        - {in: query, name: id, schema: {type: string, pattern: '^\d{1,10}$'}}
        - {in: query, name: size, schema: {type: string, enum: [M, L], default: L}}
      responses:
        "200":
          description: 'Up to eight candidates (cover id, title, optional author and year) for title, or a raster image of at most 2 MB for id'
          content:
            application/json: {schema: {type: object}}
            image/jpeg: {schema: {type: string, format: binary}}
        "400": {description: Missing, invalid, or overlong parameter}
        "403": {description: Cross-origin browser request or hotlink}
        "404": {description: Open Library has no image for that cover id}
        "405": {description: Not a GET}
        "429": {description: Best-effort isolate-local throttle, separate from chat and Gutenberg}
        "502": {description: Upstream refused, or returned a non-raster or oversized image}
        "504": {description: Upstream headers exceeded 20 seconds}
  /health:
    get:
      summary: Worker liveness, no provider or storage requests
      responses:
        "200": {description: Running, not a dependency readiness guarantee}
  /session:
    post:
      summary: Audiobook Worker only, exchange bearer token for signed object URLs
      security: [{bearerAuth: []}]
      parameters:
        - in: header
          name: Origin
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Session, never cached
          content:
            application/json:
              schema:
                type: object
                required: [audioUrl, metadataUrl, expiresAt]
                properties:
                  audioUrl: {type: string, format: uri}
                  metadataUrl: {type: string, format: uri}
                  expiresAt: {type: integer}
        "401": {description: Invalid token}
        "403": {description: Missing or disallowed Origin}
        "429": {description: Session rate limit}
  /objects/{key}:
    get:
      summary: Audiobook Worker only, allowlisted R2 object with optional single byte range
      parameters:
        - {in: path, name: key, required: true, schema: {type: string}}
        - {in: query, name: expires, required: true, schema: {type: integer}}
        - {in: query, name: signature, required: true, schema: {type: string}}
        - {in: header, name: Range, schema: {type: string}}
      responses:
        "200": {description: Full object}
        "206": {description: Single byte range}
        "401": {description: Invalid or expired signature}
        "404": {description: Not allowlisted or missing}
        "416": {description: Invalid range}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
