name: mirror

on:
  push:
  delete:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  rami:
    if: github.repository == 'critesjosh/marginalia'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Push all branches and tags to Agentic-Possible/Rami
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.RAMI_MIRROR_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$MIRROR_DEPLOY_KEY" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git clone --bare "https://github.com/${GITHUB_REPOSITORY}.git" source.git
          GIT_SSH_COMMAND='ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes' \
            git -C source.git push --mirror git@github.com:Agentic-Possible/Rami.git
