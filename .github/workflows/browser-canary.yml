name: browser-canary

# Nightly QA in branded Chrome stable and beta. Beta leads stable by about four
# weeks, so a failure here is time to fix or report before users update.
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    if: github.repository == 'critesjosh/marginalia'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        channel: [chrome, chrome-beta]
    env:
      QA_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Runner package mirrors occasionally stall; retry rather than hit the job timeout.
      - run: |
          for attempt in 1 2 3; do
            timeout 240 npx playwright install --with-deps "$QA_CHANNEL" && exit 0
            echo "Playwright install attempt $attempt failed"
          done
          exit 1
      - id: version
        run: |
          node --input-type=module -e "
            import { chromium } from '@playwright/test'
            const browser = await chromium.launch({ channel: process.env.QA_CHANNEL })
            console.log('browser=' + process.env.QA_CHANNEL + ' ' + browser.version())
            await browser.close()
          " >> "$GITHUB_OUTPUT"
      - run: npm run test:qa:canary
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-canary-${{ matrix.channel }}
          path: |
            playwright-report/
            test-results/
      - name: Track the result in one open issue per channel
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER: ${{ steps.version.outputs.browser }}
          FAILED: ${{ job.status != 'success' }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Empty when setup failed, including Chrome not installing or launching.
          BROWSER=${BROWSER:-$QA_CHANNEL (version unknown)}
          title="Browser canary failing: $QA_CHANNEL"
          issue=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ "$FAILED" = true ]; then
            body="QA failed in $BROWSER: $RUN"
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title "$title" \
                --body "$body"$'\n\n'"Rerun against \`chrome\` to tell a browser change from an app change."
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Passing again in $BROWSER: $RUN"
          fi
